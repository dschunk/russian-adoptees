  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a7"/><stop offset=".25" stop-color="#e9c45d"/><stop offset=".55" stop-color="#b8892f"/><stop offset=".8" stop-color="#f5d77a"/><stop offset="1" stop-color="#9a6d1c"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
